# Publishes @arijs/frontend to npm via TRUSTED PUBLISHING (OIDC).
#
# No long-lived NPM_TOKEN. GitHub Actions authenticates to npm over OpenID
# Connect: npm accepts a publish from this workflow with a short-lived signed
# token, and attaches provenance automatically. This works with 2FA enabled on
# the account, which matters — the "bypass 2FA" tokens are being retired.
#
# ONE-TIME SETUP, on npmjs.com:
#   Package settings -> Trusted Publishers -> Add -> GitHub Actions
#     Organization/user:  arijs
#     Repository:         front-end
#     Workflow filename:  publish.yml
#
#   @arijs/frontend already exists on npm, so no manual bootstrap publish is
#   needed: configure the trusted publisher and this workflow can take over.
#
# NOTE ON RE-RUNS: re-running a failed run replays the OLD commit. After
# pushing a fix, start a fresh run from Actions -> Publish -> Run workflow.
# Do not use "Re-run jobs".

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run (does not actually publish)'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    name: Test + npm publish (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing over OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 22 is
      # older than that.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - run: npm ci

      # The gate. Worth having only because a failing assertion now exits
      # non-zero — this suite used to report success on a broken run.
      - name: Test
        run: npm test

      # package.json is the single source of truth for the version. When the run
      # comes from a release, the tag has to agree with it, otherwise the tag and
      # the published artifact disagree forever.
      - name: Check the version
        id: ver
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "package.json: $PKG"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG="${TAG#v}"
            echo "release tag:  $TAG"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::Tag v$TAG does not match package.json ($PKG). Bump the version, or retag."
              exit 1
            fi
          fi

          if npm view "@arijs/frontend@$PKG" version > /dev/null 2>&1; then
            echo "::error::@arijs/frontend@$PKG is already published. npm versions are immutable — bump first."
            exit 1
          fi

          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # npm publish runs prepack, which builds lib/. That build is what main and
      # the require conditions point at, so publishing without it would ship a
      # package that breaks every CommonJS consumer.
      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run — nothing is published."
            npm publish --dry-run
          else
            npm publish
          fi

      - name: Summary
        run: |
          echo "### @arijs/frontend ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@arijs/frontend/v/${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
